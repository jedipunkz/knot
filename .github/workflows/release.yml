name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v${major}.${minor}.${patch}"
          echo "$latest -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output="dist/knot_${TAG}_${os}_${arch}"
            [ "$os" = "windows" ] && output="${output}.exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${TAG}" -o "$output" ./cmd/knot
          done
          ls -lh dist/

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jedipunkz/homebrew-knot
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Update formula
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          curl -fsSL "https://github.com/jedipunkz/knot/releases/download/${TAG}/checksums.txt" -o checksums.txt
          cat checksums.txt
          sed -i "s/version \".*\"/version \"${TAG#v}\"/" Formula/knot.rb
          # Each url line names its platform; the sha256 line follows it.
          for p in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            sha=$(awk -v f="knot_${TAG}_${p}" '$2 == f {print $1}' checksums.txt)
            test -n "$sha"
            sed -i "/${p}\"/{n;s/sha256 \".*\"/sha256 \"${sha}\"/}" Formula/knot.rb
          done
          cat Formula/knot.rb

      - name: Commit and push
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/knot.rb
          git commit -m "Update knot formula to ${TAG}"
          git push
